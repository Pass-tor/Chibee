                </div>
              </div>

              <div className="rounded-2xl border border-white/10 bg-white/5 p-8">
                <div className="flex justify-between items-center mb-6">
                  <div className="font-medium">Send a message</div>
                  <span className="text-[10px] px-2 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">mailto</span>
                </div>
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div className="grid sm:grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs tracking-wider uppercase text-zinc-500">Name</label>
                      <input
                        value={form.name}
                        onChange={e => setForm({...form, name: e.target.value})}
                        className="mt-2 w-full h-11 rounded-xl bg-black/40 border border-white/10 px-4 text-sm focus:outline-none focus:border-violet-500/50"
                        placeholder="Your name"
                      />
                    </div>
                    <div>
                      <label className="text-xs tracking-wider uppercase text-zinc-500">Email</label>
                      <input
                        type="email"
                        value={form.email}
                        onChange={e => setForm({...form, email: e.target.value})}
                        className="mt-2 w-full h-11 rounded-xl bg-black/40 border border-white/10 px-4 text-sm focus:outline-none focus:border-violet-500/50"
                        placeholder="you@email.com"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs tracking-wider uppercase text-zinc-500">Message</label>
                    <textarea
                      value={form.message}
                      onChange={e => setForm({...form, message: e.target.value})}
                      rows="5"
                      className="mt-2 w-full rounded-xl bg-black/40 border border-white/10 px-4 py-3 text-sm focus:outline-none focus:border-violet-500/50 resize-none"
                      placeholder="Tell me about the project..."
                    ></textarea>
                  </div>
                  <button type="submit" className="w-full sm:w-auto px-6 py-3 rounded-full bg-gradient-to-r from-blue-600 to-violet-600 text-white text-sm font-medium">
                    Send Message →
                  </button>
                </form>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="border-t border-white/10 mt-10">
            <div className="max-w-6xl mx-auto px-5 py-10 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div>
                <div className="font-semibold">{CONFIG.name}</div>
                <div className="text-sm text-zinc-500 mt-1">{CONFIG.footerTagline}</div>
              </div>
              <div className="flex gap-3 text-sm">
                <a href={CONFIG.github} target="_blank" className="px-3 py-1.5 rounded-full bg-white/5 border border-white/10 hover:bg-white/10">GitHub</a>
                <a href={`mailto:${CONFIG.email}`} className="px-3 py-1.5 rounded-full bg-white/5 border border-white/10 hover:bg-white/10">Email</a>
              </div>
            </div>
            <div className="max-w-6xl mx-auto px-5 pb-8 text-xs text-zinc-600">
              © {new Date().getFullYear()} {CONFIG.shortName} • ESX Legacy + ox + Custom Anticheat • No fake claims
            </div>
          </footer>

          {toast && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-full bg-white text-black text-sm font-medium shadow-xl z-50">
              {toast}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
